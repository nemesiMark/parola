<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parola</title>
<meta name="description" content="Parola, un editor di testi nel browser che apre e salva file .docx.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23458cf5'/%3E%3Cstop offset='1' stop-color='%231747ad'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='23.5' text-anchor='middle' font-family='-apple-system,system-ui,sans-serif' font-weight='800' font-size='20' fill='%23fff'%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icone -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 4H6.5A1.5 1.5 0 0 0 5 5.5v14A1.5 1.5 0 0 0 6.5 21H10"/><path d="M15 4h2.5A1.5 1.5 0 0 1 19 5.5V9"/><rect x="9" y="2.5" width="6" height="3.5" rx="1"/><rect x="12" y="11" width="8.5" height="10.5" rx="1.2"/></symbol>

    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="1.5"/><path d="M15.5 8.5V5A1.5 1.5 0 0 0 14 3.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></symbol>

    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M6 5h12M12 5l-3 14M15 15l5 5M20 15l-5 5"/></symbol>
    <symbol id="i-color" viewBox="0 0 24 24"><path d="m6.5 16 5.5-12 5.5 12M8.7 11.5h6.6"/></symbol>
    <symbol id="i-hilite" viewBox="0 0 24 24"><path d="m9 11-5 5v2.5h3l5-5M9 11l6-6 4 4-6 6M9 11l4 4"/></symbol>
    <symbol id="i-ul" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.1" class="f"/><circle cx="4.5" cy="12" r="1.1" class="f"/><circle cx="4.5" cy="18" r="1.1" class="f"/></symbol>
    <symbol id="i-ol" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 4.5h1.5V9M4 9h3M4 14.5c.4-.6 1-1 1.6-1 .8 0 1.4.5 1.4 1.2 0 1.1-3 2.2-3 3.8h3"/></symbol>
    <symbol id="i-outdent" viewBox="0 0 24 24"><path d="M11 6h9M11 12h9M11 18h9M4 6h3M4 18h3M7 9l-3 3 3 3"/></symbol>
    <symbol id="i-indent" viewBox="0 0 24 24"><path d="M11 6h9M11 12h9M11 18h9M4 6h3M4 18h3M4 9l3 3-3 3"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M17 4v16M13.5 16.5 17 20l3.5-3.5"/><path d="M4 10.5 6.5 4 9 10.5M4.8 8.5h3.4M4 14h5l-5 6h5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></symbol>
    <symbol id="i-center" viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></symbol>
    <symbol id="i-justify" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></symbol>
    <symbol id="i-spacing" viewBox="0 0 24 24"><path d="M11 6h10M11 12h10M11 18h10M5.5 4v16M3 6.5l2.5-2.5L8 6.5M3 17.5 5.5 20 8 17.5"/></symbol>
    <symbol id="i-shade" viewBox="0 0 24 24"><path d="m11 3.5 7 7-6.5 6.5a1.5 1.5 0 0 1-2.1 0L4.5 12.1a1.5 1.5 0 0 1 0-2.1zM5 10.5h12.5M19.5 13.5s1.5 2 1.5 3a1.5 1.5 0 0 1-3 0c0-1 1.5-3 1.5-3z"/></symbol>
    <symbol id="i-borders" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" stroke-dasharray="2 2.4"/><path d="M4 20h16" stroke-width="2.4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-find" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m20 20-5-5"/></symbol>
    <symbol id="i-replace" viewBox="0 0 24 24"><path d="M4 7h11l-3-3M20 17H9l3 3"/><path d="M4 7v3M20 17v-3"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 16-5-5-9 8.5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M3.5 15h17M9.5 4.5v15M15 4.5v15"/></symbol>
    <symbol id="i-break" viewBox="0 0 24 24"><path d="M6 3v5h12V3M6 21v-5h12v5M3 12h2M8 12h3M13 12h3M19 12h2"/></symbol>
    <symbol id="i-hr" viewBox="0 0 24 24"><path d="M3 12h18M6 7h12M6 17h12" stroke-opacity=".45"/><path d="M3 12h18"/></symbol>
    <symbol id="i-date" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M12 14h2M16 14h0M8 17h2"/></symbol>
    <symbol id="i-margins" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8.5 3v18M15.5 3v18M5 6.5h14M5 17.5h14" stroke-dasharray="1.6 1.8"/></symbol>
    <symbol id="i-orient" viewBox="0 0 24 24"><rect x="3" y="6" width="11" height="14" rx="1"/><path d="M14 8.5h5.5a1 1 0 0 1 1 1V15M17 4.5a5 5 0 0 1 3.5 3.5M20.5 8l.2-2.6L18.3 6"/></symbol>
    <symbol id="i-size" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1"/><path d="M3 6v12M1.8 7.2 3 6l1.2 1.2M1.8 16.8 3 18l1.2-1.2M9 8h6M9 11h6M9 14h4"/></symbol>
    <symbol id="i-spell" viewBox="0 0 24 24"><path d="M3 13 5.5 5 8 13M3.8 10.5h3.4M10.5 5v8h2.3a2 2 0 0 0 0-4h-2.3M12.8 9a2 2 0 0 0 0-4M20.5 6.5A3 3 0 0 0 15 8v2a3 3 0 0 0 5.5 1.5M9 18l3 3 7-7"/></symbol>
    <symbol id="i-count" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M7.5 8h3M7.5 12h9M7.5 16h9M14 6.5v3M12.5 8h3"/></symbol>
    <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m20 20-5-5M8 10.5h5M10.5 8v5"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1"/><path d="M2 12h3M19 12h3M3.5 10.5 2 12l1.5 1.5M20.5 10.5 22 12l-1.5 1.5"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-row-above" viewBox="0 0 24 24"><rect x="3.5" y="11" width="17" height="9.5" rx="1"/><path d="M3.5 15.7h17M12 2.5v6M9 5.5h6"/></symbol>
    <symbol id="i-row-below" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="9.5" rx="1"/><path d="M3.5 8.2h17M12 15.5v6M9 18.5h6"/></symbol>
    <symbol id="i-col-left" viewBox="0 0 24 24"><rect x="11" y="3.5" width="9.5" height="17" rx="1"/><path d="M15.7 3.5v17M2.5 12h6M5.5 9v6"/></symbol>
    <symbol id="i-col-right" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="9.5" height="17" rx="1"/><path d="M8.2 3.5v17M15.5 12h6M18.5 9v6"/></symbol>
    <symbol id="i-del-row" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="8" rx="1"/><path d="m9 10 6 4M15 10l-6 4"/></symbol>
    <symbol id="i-del-col" viewBox="0 0 24 24"><rect x="8" y="3.5" width="8" height="17" rx="1"/><path d="m10 9 4 6M14 9l-4 6"/></symbol>
    <symbol id="i-del-table" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M9.5 4.5V10M15 4.5V10M9 13l6 5M15 13l-6 5"/></symbol>
    <symbol id="i-header" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17" stroke-width="3"/><path d="M3.5 14.5h17M12 9.5v10"/></symbol>
  </defs>
</svg>

<header class="topbar">
  <div class="brand" aria-hidden="true">W</div>
  <div class="quick">
    <button class="qb" data-cmd="undo" title="Annulla (⌘Z)"><svg><use href="#i-undo"/></svg></button>
    <button class="qb" data-cmd="redo" title="Ripeti (⌘⇧Z)"><svg><use href="#i-redo"/></svg></button>
  </div>
  <div class="doc-meta">
    <input id="title" class="title" value="Documento senza titolo" aria-label="Titolo del documento" spellcheck="false">
    <span id="saveState" class="save-state">Salvato</span>
  </div>
  <nav class="file-actions" aria-label="File">
    <button class="btn ghost" id="btnNew">Nuovo</button>
    <button class="btn ghost" id="btnOpen">Apri…</button>
    <button class="btn ghost" id="btnPdf">PDF</button>
    <button class="btn primary" id="btnSave">Scarica .docx</button>
  </nav>
  <input type="file" id="fileOpen" accept=".docx,.html,.htm,.txt" hidden>
  <input type="file" id="fileImage" accept="image/*" hidden>
</header>

<div class="ribbon-tabs" role="tablist" aria-label="Schede">
  <button role="tab" class="rtab" data-tab="home" aria-selected="true">Home</button>
  <button role="tab" class="rtab" data-tab="insert" aria-selected="false">Inserisci</button>
  <button role="tab" class="rtab" data-tab="layout" aria-selected="false">Layout</button>
  <button role="tab" class="rtab" data-tab="review" aria-selected="false">Revisione</button>
  <button role="tab" class="rtab" data-tab="view" aria-selected="false">Visualizza</button>
  <button role="tab" class="rtab ctx" data-tab="table" aria-selected="false" id="tabTable" hidden>Tabella</button>
</div>

<div class="ribbon" id="ribbon">

  <!-- ===== HOME ===== -->
  <section class="panel" data-panel="home" role="tabpanel">
    <div class="rgroup">
      <button class="big" id="btnPaste" title="Incolla (⌘V)"><svg><use href="#i-paste"/></svg><span>Incolla</span></button>
      <div class="col">
        <button class="tb" data-cmd="cut" title="Taglia (⌘X)"><svg><use href="#i-cut"/></svg></button>
        <button class="tb" data-cmd="copy" title="Copia (⌘C)"><svg><use href="#i-copy"/></svg></button>
        <button class="tb" id="btnPainter" title="Copia formato: seleziona il testo da cui copiare, premi qui, poi seleziona il testo da cambiare"><svg><use href="#i-painter"/></svg></button>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row">
          <select id="fontName" class="sel sel-font" title="Carattere">
            <option>Georgia</option><option>Times New Roman</option><option>Garamond</option>
            <option>Arial</option><option>Helvetica</option><option>Verdana</option>
            <option>Calibri</option><option>Courier New</option>
          </select>
          <select id="fontSize" class="sel sel-size" title="Dimensione (pt)">
            <option>8</option><option>9</option><option>10</option><option>11</option>
            <option selected>12</option><option>14</option><option>16</option><option>18</option>
            <option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option>
          </select>
          <button class="tb glyph" id="btnGrow" title="Ingrandisci carattere">A<sup>⌃</sup></button>
          <button class="tb glyph small-a" id="btnShrink" title="Riduci carattere">A<sup>⌄</sup></button>
          <span class="vsep"></span>
          <button class="tb glyph wide" data-pop="popCase" title="Maiuscole e minuscole">Aa<svg class="chev"><use href="#i-down"/></svg></button>
          <span class="vsep"></span>
          <button class="tb" data-cmd="removeFormat" title="Cancella formattazione"><svg><use href="#i-clear"/></svg></button>
        </div>
        <div class="row">
          <button class="tb glyph b" data-cmd="bold" title="Grassetto (⌘B)">G</button>
          <button class="tb glyph i" data-cmd="italic" title="Corsivo (⌘I)">C</button>
          <button class="tb glyph u" data-cmd="underline" title="Sottolineato (⌘U)">S</button>
          <button class="tb glyph s" data-cmd="strikeThrough" title="Barrato">ab</button>
          <button class="tb glyph" data-cmd="subscript" title="Pedice">x<sub>2</sub></button>
          <button class="tb glyph" data-cmd="superscript" title="Apice">x<sup>2</sup></button>
          <span class="vsep"></span>
          <label class="tb color" title="Colore del testo">
            <svg><use href="#i-color"/></svg>
            <span class="swatch" id="swText" style="background:#c0392b"></span>
            <input type="color" id="foreColor" value="#c0392b">
          </label>
          <label class="tb color" title="Evidenziatore">
            <svg><use href="#i-hilite"/></svg>
            <span class="swatch" id="swHi" style="background:#ffe58a"></span>
            <input type="color" id="hiliteColor" value="#ffe58a">
          </label>
        </div>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row">
          <button class="tb" data-cmd="insertUnorderedList" title="Elenco puntato"><svg><use href="#i-ul"/></svg></button>
          <button class="tb" data-cmd="insertOrderedList" title="Elenco numerato"><svg><use href="#i-ol"/></svg></button>
          <span class="vsep"></span>
          <button class="tb" data-cmd="outdent" title="Riduci rientro"><svg><use href="#i-outdent"/></svg></button>
          <button class="tb" data-cmd="indent" title="Aumenta rientro"><svg><use href="#i-indent"/></svg></button>
          <span class="vsep"></span>
          <button class="tb" id="btnSort" title="Ordina dalla A alla Z i paragrafi selezionati o l'elenco"><svg><use href="#i-sort"/></svg></button>
          <span class="vsep"></span>
          <button class="tb glyph pil" id="btnMarks" title="Mostra segni di paragrafo">¶</button>
        </div>
        <div class="row">
          <button class="tb" data-cmd="justifyLeft" title="Allinea a sinistra"><svg><use href="#i-left"/></svg></button>
          <button class="tb" data-cmd="justifyCenter" title="Centra"><svg><use href="#i-center"/></svg></button>
          <button class="tb" data-cmd="justifyRight" title="Allinea a destra"><svg><use href="#i-right"/></svg></button>
          <button class="tb" data-cmd="justifyFull" title="Giustifica"><svg><use href="#i-justify"/></svg></button>
          <span class="vsep"></span>
          <button class="tb wide" data-pop="popSpacing" title="Interlinea"><svg><use href="#i-spacing"/></svg><svg class="chev"><use href="#i-down"/></svg></button>
          <span class="vsep"></span>
          <label class="tb color wide" title="Sfondo del paragrafo">
            <svg><use href="#i-shade"/></svg>
            <span class="swatch" id="swShade" style="background:#fde7d9"></span>
            <input type="color" id="shadeColor" value="#fde7d9">
          </label>
          <button class="tb wide" data-pop="popBorders" title="Bordi del paragrafo"><svg><use href="#i-borders"/></svg><svg class="chev"><use href="#i-down"/></svg></button>
        </div>
      </div>
    </div>

    <div class="rgroup">
      <div class="styles" id="styleGallery">
        <button class="style-tile" data-style="p"><span class="sample s-p">AaBbCcDd</span><span class="name">Normale</span></button>
        <button class="style-tile" data-style="h1"><span class="sample s-h1">AaBbCc</span><span class="name">Titolo 1</span></button>
        <button class="style-tile" data-style="h2"><span class="sample s-h2">AaBbCcD</span><span class="name">Titolo 2</span></button>
        <button class="style-tile" data-style="h3"><span class="sample s-h3">AaBbCcDd</span><span class="name">Titolo 3</span></button>
        <button class="style-tile" data-style="blockquote"><span class="sample s-q">AaBbCcDd</span><span class="name">Citazione</span></button>
        <button class="style-tile" data-style="em"><span class="sample s-em">AaBbCcDd</span><span class="name">Enfasi</span></button>
      </div>
    </div>

    <div class="rgroup">
      <div class="rows">
        <div class="row"><button class="tb lbl-btn" id="btnFind" title="Trova (⌘F)"><svg><use href="#i-find"/></svg><span>Trova</span></button></div>
        <div class="row"><button class="tb lbl-btn" id="btnReplace" title="Sostituisci (⌘⌥H)"><svg><use href="#i-replace"/></svg><span>Sostituisci</span></button></div>
      </div>
    </div>
  </section>

  <!-- ===== INSERISCI ===== -->
  <section class="panel" data-panel="insert" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big" id="btnPageBreak" title="Interruzione di pagina"><svg><use href="#i-break"/></svg><span>Interruzione<br>di pagina</span></button>
    </div>
    <div class="rgroup">
      <button class="big" data-pop="tablePicker" id="btnTable" title="Inserisci tabella"><svg><use href="#i-table"/></svg><span>Tabella <svg class="chev in"><use href="#i-down"/></svg></span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnImage" title="Inserisci un'immagine dal computer"><svg><use href="#i-image"/></svg><span>Immagine</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnLink" title="Collegamento (⌘K)"><svg><use href="#i-link"/></svg><span>Collegamento</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnHr" title="Linea orizzontale"><svg><use href="#i-hr"/></svg><span>Linea</span></button>
      <button class="big" id="btnDate" title="Inserisci la data di oggi"><svg><use href="#i-date"/></svg><span>Data</span></button>
      <button class="big" data-pop="popSymbols" title="Simbolo"><span class="big-glyph">Ω</span><span>Simbolo <svg class="chev in"><use href="#i-down"/></svg></span></button>
    </div>
  </section>

  <!-- ===== LAYOUT ===== -->
  <section class="panel" data-panel="layout" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big" data-pop="popMargins" title="Margini"><svg><use href="#i-margins"/></svg><span>Margini <svg class="chev in"><use href="#i-down"/></svg></span></button>
      <button class="big" data-pop="popOrient" title="Orientamento"><svg><use href="#i-orient"/></svg><span>Orientamento <svg class="chev in"><use href="#i-down"/></svg></span></button>
      <button class="big" data-pop="popSize" title="Dimensioni del foglio"><svg><use href="#i-size"/></svg><span>Dimensioni <svg class="chev in"><use href="#i-down"/></svg></span></button>
    </div>
    <div class="rgroup">
      <div class="rows">
        <div class="row"><button class="tb" data-cmd="outdent" title="Riduci rientro"><svg><use href="#i-outdent"/></svg></button><span class="lbl">Riduci rientro</span></div>
        <div class="row"><button class="tb" data-cmd="indent" title="Aumenta rientro"><svg><use href="#i-indent"/></svg></button><span class="lbl">Aumenta rientro</span></div>
      </div>
    </div>
    <div class="rgroup">
      <button class="big" data-pop="popSpacing" title="Interlinea"><svg><use href="#i-spacing"/></svg><span>Interlinea <svg class="chev in"><use href="#i-down"/></svg></span></button>
    </div>
  </section>

  <!-- ===== REVISIONE ===== -->
  <section class="panel" data-panel="review" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big toggle" id="btnSpell" title="Sottolinea le parole scritte male"><svg><use href="#i-spell"/></svg><span>Controllo<br>ortografia</span></button>
      <button class="big" id="btnCount" title="Conteggio parole"><svg><use href="#i-count"/></svg><span>Conteggio<br>parole</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnFind2" title="Trova (⌘F)"><svg><use href="#i-find"/></svg><span>Trova</span></button>
    </div>
  </section>

  <!-- ===== VISUALIZZA ===== -->
  <section class="panel" data-panel="view" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big" id="btnZoom100" title="Zoom al 100%"><svg><use href="#i-zoom"/></svg><span>100%</span></button>
      <button class="big" id="btnFit" title="Adatta la pagina alla larghezza della finestra"><svg><use href="#i-fit"/></svg><span>Larghezza<br>pagina</span></button>
    </div>
    <div class="rgroup">
      <button class="big toggle" id="btnMarks2" title="Mostra segni di paragrafo"><span class="big-glyph">¶</span><span>Segni di<br>paragrafo</span></button>
    </div>
    <div class="rgroup">
      <button class="big" id="btnTheme" title="Tema chiaro, scuro o automatico"><svg><use href="#i-theme"/></svg><span id="themeLabel">Tema: auto</span></button>
      <button class="big" id="btnFull" title="Schermo intero"><svg><use href="#i-full"/></svg><span>Schermo<br>intero</span></button>
    </div>
  </section>

  <!-- ===== TABELLA (scheda contestuale) ===== -->
  <section class="panel" data-panel="table" role="tabpanel" hidden>
    <div class="rgroup">
      <button class="big" data-table="rowAbove"><svg><use href="#i-row-above"/></svg><span>Riga<br>sopra</span></button>
      <button class="big" data-table="rowBelow"><svg><use href="#i-row-below"/></svg><span>Riga<br>sotto</span></button>
      <button class="big" data-table="colLeft"><svg><use href="#i-col-left"/></svg><span>Colonna<br>a sinistra</span></button>
      <button class="big" data-table="colRight"><svg><use href="#i-col-right"/></svg><span>Colonna<br>a destra</span></button>
    </div>
    <div class="rgroup">
      <button class="big" data-table="delRow"><svg><use href="#i-del-row"/></svg><span>Elimina<br>riga</span></button>
      <button class="big" data-table="delCol"><svg><use href="#i-del-col"/></svg><span>Elimina<br>colonna</span></button>
      <button class="big" data-table="delTable"><svg><use href="#i-del-table"/></svg><span>Elimina<br>tabella</span></button>
    </div>
    <div class="rgroup">
      <button class="big" data-table="header"><svg><use href="#i-header"/></svg><span>Riga di<br>intestazione</span></button>
    </div>
  </section>
</div>

<!-- Menu a comparsa -->
<div class="popover" id="tablePicker" hidden>
  <div class="grid" id="tableGrid"></div>
  <div class="grid-label" id="tableLabel">Scegli righe e colonne</div>
</div>
<div class="popover menu" id="popCase" hidden>
  <button data-case="sentence">Come una frase.</button>
  <button data-case="lower">minuscolo</button>
  <button data-case="upper">MAIUSCOLO</button>
  <button data-case="title">Iniziali Maiuscole</button>
</div>
<div class="popover menu" id="popSpacing" hidden>
  <button data-lh="1">1,0</button>
  <button data-lh="1.15">1,15</button>
  <button data-lh="1.5">1,5</button>
  <button data-lh="2">2,0</button>
  <button data-lh="2.5">2,5</button>
</div>
<div class="popover menu" id="popBorders" hidden>
  <button data-border="bottom">Bordo inferiore</button>
  <button data-border="top">Bordo superiore</button>
  <button data-border="box">Riquadro</button>
  <button data-border="none">Nessun bordo</button>
  <button data-border="noshade">Togli sfondo del paragrafo</button>
</div>
<div class="popover menu" id="popMargins" hidden>
  <button data-margins="normal"><b>Normali</b><small>Sopra e sotto 2,5 cm · lati 2 cm</small></button>
  <button data-margins="narrow"><b>Stretti</b><small>1,27 cm su tutti i lati</small></button>
  <button data-margins="moderate"><b>Moderati</b><small>Sopra e sotto 2,54 cm · lati 1,91 cm</small></button>
  <button data-margins="wide"><b>Ampi</b><small>Sopra e sotto 2,54 cm · lati 5,08 cm</small></button>
</div>
<div class="popover menu" id="popOrient" hidden>
  <button data-orient="portrait">Verticale</button>
  <button data-orient="landscape">Orizzontale</button>
</div>
<div class="popover menu" id="popSize" hidden>
  <button data-size="A4"><b>A4</b><small>21 × 29,7 cm</small></button>
  <button data-size="A5"><b>A5</b><small>14,8 × 21 cm</small></button>
  <button data-size="Letter"><b>Lettera</b><small>21,59 × 27,94 cm</small></button>
</div>
<div class="popover" id="popSymbols" hidden>
  <div class="symbols" id="symbolGrid"></div>
</div>

<div class="findbar" id="findbar" hidden>
  <input id="findInput" placeholder="Trova" aria-label="Testo da trovare">
  <input id="replaceInput" placeholder="Sostituisci con" aria-label="Testo sostitutivo">
  <button class="btn small" id="findNext">Successivo</button>
  <button class="btn small" id="replaceOne">Sostituisci</button>
  <button class="btn small" id="replaceAll">Sostituisci tutto</button>
  <span class="find-count" id="findCount"></span>
  <button class="btn small ghost" id="findClose" aria-label="Chiudi">✕</button>
</div>

<main class="desk" id="desk">
  <article class="page" id="page">
    <div id="editor" class="editor" contenteditable="true" spellcheck="true" lang="it" aria-label="Testo del documento"></div>
  </article>
</main>

<div class="imgbar" id="imgbar" hidden>
  <button class="btn small" data-w="25">25%</button>
  <button class="btn small" data-w="50">50%</button>
  <button class="btn small" data-w="75">75%</button>
  <button class="btn small" data-w="100">100%</button>
  <button class="btn small danger" data-w="del">Elimina</button>
</div>

<footer class="statusbar">
  <span id="stats">0 parole</span>
  <span id="painterHint" class="hint" hidden>Copia formato attivo: seleziona il testo da cambiare (Esc per annullare)</span>
  <span class="spacer"></span>
  <label class="zoom">Zoom
    <input type="range" id="zoom" min="50" max="200" step="10" value="100" aria-label="Zoom">
    <output id="zoomOut">100%</output>
  </label>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/mammoth.browser.min.js" defer></script>
<script src="vendor/docx.umd.js" defer></script>
<script src="docx-export.js" defer></script>
<script src="app.js" defer></script>
</body>
